[package]
name = "min-rs"
version = "0.1.0"
edition = "2024"
license="MIT"
description="A library to work with max's api directly through the sockets."
authors = ["BadCoder"]
readme="README.md"
repository="https://github.com/Vova-max-png/min-rs"
keywords = ["max", "messenger"]
exclude=["/target"]

[dependencies]
futures-util = "0.3.31"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"